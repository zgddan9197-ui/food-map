<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>食刻 · 网页预览</title>
    <style>
      :root {
        --bg: radial-gradient(circle at 0% 0%, #fff4e0 0%, #f9f7ef 45%, #eef6f1 100%);
        --card: rgba(255, 255, 255, 0.9);
        --line: rgba(17, 42, 31, 0.1);
        --text: #223127;
        --muted: #5a6b5f;
        --primary: #eb6a39;
        --secondary: #1d5f46;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
      .hero, .panel, .card, .mapbox {
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(30, 45, 36, 0.12);
      }
      .hero { padding: 22px; margin-bottom: 14px; }
      .hero h1 { margin: 8px 0; font-size: 30px; line-height: 1.2; }
      .hero p { margin: 0; color: var(--muted); }
      .grid { display: grid; grid-template-columns: 340px 1fr; gap: 14px; }
      .panel { padding: 14px; }
      .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; }
      select, input {
        width: 100%; padding: 10px; border-radius: 10px;
        border: 1px solid var(--line); background: #fff;
      }
      .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
      .chip {
        padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line);
        background: #fff; font-size: 13px;
      }
      .chip.active { background: #fff0e9; border-color: #f3b597; color: #a14b2a; }
      .btn {
        margin-top: 10px; width: 100%; border: 0; border-radius: 10px;
        background: var(--primary); color: #fff; font-weight: 700; padding: 11px;
      }
      .list { margin-top: 12px; display: grid; gap: 10px; }
      .card { padding: 10px 12px; }
      .card h3 { margin: 0 0 6px; font-size: 15px; }
      .card p { margin: 0; color: var(--muted); font-size: 13px; }
      .mapbox { position: relative; min-height: 520px; overflow: hidden; }
      .maphead {
        position: absolute; left: 12px; top: 12px; z-index: 2;
        padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.9);
        border: 1px solid var(--line); font-size: 12px; color: var(--muted);
      }
      .pin {
        position: absolute; width: 40px; height: 40px; border-radius: 50%;
        border: 0; background: #fff; box-shadow: 0 6px 15px rgba(0,0,0,.18);
        font-size: 18px; transform: translate(-50%, -50%);
      }
      .pin b {
        position: absolute; right: -6px; top: -6px; width: 18px; height: 18px;
        border-radius: 50%; background: var(--secondary); color: #fff; font-size: 10px;
        display: grid; place-items: center;
      }
      .hint {
        position: absolute; left: 12px; right: 12px; bottom: 12px;
        border: 1px solid #f0c7b3; background: #fff8f3; border-radius: 10px;
        padding: 10px; font-size: 13px; color: #77422b;
      }
      @media (max-width: 900px) {
        .grid { grid-template-columns: 1fr; }
        .mapbox { min-height: 380px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="hero">
        <p>食刻 · 大学城美食地图</p>
        <h1>此刻，带你逛遍大学城的每一口好吃的</h1>
        <p>这是可直接查看的单文件网页预览版（离线可打开）。</p>
      </section>

      <div class="grid">
        <aside class="panel">
          <label class="label" for="campus">校区</label>
          <select id="campus">
            <option>青杉大学</option>
            <option>云麓理工大学</option>
            <option>星海师范学院</option>
            <option>南湾医学院</option>
          </select>

          <div class="chips">
            <span class="chip active">一个人</span>
            <span class="chip">2-3 人</span>
            <span class="chip">4 人以上</span>
          </div>

          <label class="label" for="query">一句话描述你现在想吃什么</label>
          <input id="query" value="想吃辣的，不贵，步行 15 分钟内" />
          <button class="btn">开始推荐</button>

          <div class="list">
            <article class="card">
              <h3>🍴 青杉热气砂锅面</h3>
              <p>步行约 9 分钟，出餐快，多人提到“汤底鲜”。</p>
            </article>
            <article class="card">
              <h3>🚩 青杉桥头麻辣烫</h3>
              <p>步行约 12 分钟，夜宵友好，辣口稳定。</p>
            </article>
            <article class="card">
              <h3>🍴 青杉椒香冒菜实验室</h3>
              <p>步行约 14 分钟，重口味友好，分量足。</p>
            </article>
          </div>
        </aside>

        <section class="mapbox">
          <div class="maphead">地图预览模式</div>
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%">
            <defs>
              <pattern id="g" width="10" height="10" patternUnits="userSpaceOnUse">
                <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(31,52,39,.1)" stroke-width=".3" />
              </pattern>
              <linearGradient id="r" x1="0%" x2="100%" y1="0%" y2="100%">
                <stop offset="0%" stop-color="#ff9e72" />
                <stop offset="100%" stop-color="#ef5f2d" />
              </linearGradient>
            </defs>
            <rect width="100" height="100" fill="#f9faf8"></rect>
            <rect width="100" height="100" fill="url(#g)"></rect>
            <polyline points="24,62 43,49 62,57 74,36" fill="none" stroke="url(#r)" stroke-width="1.3"></polyline>
          </svg>
          <button class="pin" style="left:24%;top:62%;">🍴<b>1</b></button>
          <button class="pin" style="left:43%;top:49%;">🚩<b>2</b></button>
          <button class="pin" style="left:62%;top:57%;">🍴<b>3</b></button>
          <button class="pin" style="left:74%;top:36%;">🍴<b>4</b></button>
          <div class="hint">推荐理由：你当前偏好“辣 + 不贵 + 步行可达”，建议先从 1 号点开始逛吃。</div>
        </section>
      </div>
    </div>
  </body>
  </html>
